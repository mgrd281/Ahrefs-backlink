<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: brand band with progress, then a filterable checklist of the competitor's link sources. KARINEX green. */
:root {
  --brand: #004f44;
  --brand-soft: #e3efec;
  --bg: #f4f7f6;
  --surface: #ffffff;
  --ink: #142320;
  --muted: #5b6b67;
  --line: #dbe5e2;
  --done: #067647;
  --done-soft: #e5f4ec;
  --hot: #b54708;
  --hot-soft: #fdf0e1;
  --warn: #b42318;
  --warn-soft: #fdecea;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #3fae98; --brand-soft: #16302b; --bg: #0c1513; --surface: #13201d; --ink: #e3eeeb;
    --muted: #94a8a3; --line: #23372f; --done: #4cc38a; --done-soft: #12302a; --hot: #f0a356;
    --hot-soft: #33240f; --warn: #f2877c; --warn-soft: #351815; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #3fae98; --brand-soft: #16302b; --bg: #0c1513; --surface: #13201d; --ink: #e3eeeb;
  --muted: #94a8a3; --line: #23372f; --done: #4cc38a; --done-soft: #12302a; --hot: #f0a356;
  --hot-soft: #33240f; --warn: #f2877c; --warn-soft: #351815; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px; }

/* header band */
.band { background: #004f44; color: #fff; padding: 20px 0 64px; }
#comps { margin-top: 8px; }
.band .wrap.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.title h1 { margin: 0; font-size: 24px; font-weight: 700; text-wrap: balance; }
.title p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
.title p bdi { font-weight: 600; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lang { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; color: #fff; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.lang button[aria-pressed="true"] { background: #fff; color: #004f44; }
.save { font-size: 13px; display: inline-flex; gap: 6px; align-items: center; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; }
.save .dot { width: 8px; height: 8px; border-radius: 50%; background: #9fd8c9; }
.save[data-s="busy"] .dot { background: #ffd28a; }
.save[data-s="off"] .dot { background: #ffb4ab; }

/* store bar */
.stores { margin-top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stores .lbl { font-size: 14px; opacity: .85; }
.sbtn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 7px; align-items: center; }
.sbtn .sd { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #fff; }
.sbtn[aria-pressed="true"] { background: #fff; color: #004f44; border-color: #fff; }
.sbtn.add { border-style: dashed; font-weight: 500; }
.addform { display: none; gap: 6px; align-items: center; flex-wrap: wrap; }
.addform.show { display: inline-flex; }
.addform input { border: 0; border-radius: 999px; padding: 6px 14px; width: 170px; color: #142320; background: #fff; direction: ltr; }
.addform button { border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.addform .ok { background: #9fd8c9; color: #00332c; }
.addform .no { background: rgba(255,255,255,.15); color: #fff; }
.adderr { font-size: 13px; color: #ffd28a; width: 100%; }
.marks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.sb { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--c); color: #fff; white-space: nowrap; }
.cur-store { color: var(--ink); font-weight: 700; }

/* summary */
.summary { margin-top: -44px; display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.prog .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.prog .big small { font-size: 16px; color: var(--muted); font-weight: 500; }
.prog .lbl { color: var(--muted); font-size: 14px; }
.bar { height: 10px; background: var(--brand-soft); border-radius: 99px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width .4s ease; }
.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .v.hot { color: var(--hot); }
.stat .l { color: var(--muted); font-size: 13.5px; }
.stat .vs { font-size: 13.5px; margin-top: 4px; }
.stat .vs b { font-variant-numeric: tabular-nums; }
.drrow { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.drrow:last-child { border: 0; }
.drrow b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.drrow bdi { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drrow.me { color: var(--brand); font-weight: 600; }
.cbtn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 500; font-size: 13.5px; }
.cbtn[aria-pressed="true"] { background: rgba(255,255,255,.2); border-color: #fff; font-weight: 700; }
.cbtn .n { opacity: .8; font-variant-numeric: tabular-nums; }
.cp { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); font-weight: 500; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 700; display: grid; place-items: center; font-size: 13px; }

.notice { display: none; margin-top: 12px; background: var(--hot-soft); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.notice.show { display: block; }

/* controls */
.controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.searchrow { display: flex; gap: 10px; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; }
.sort { min-width: 0; max-width: 42%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip[aria-pressed="true"] .n { color: rgba(255,255,255,.85); }
.chip.spamchip[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); }

/* list */
.list { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 14px; align-items: center; transition: background .2s; }
.row.is-done { background: var(--done-soft); border-color: transparent; }
.check { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .15s, border-color .15s; }
.check svg { width: 22px; height: 22px; stroke: transparent; }
.check:hover { border-color: var(--done); }
.check[aria-checked="true"] { background: var(--done); border-color: var(--done); }
.check[aria-checked="true"] svg { stroke: #fff; }
.check:disabled { opacity: .5; cursor: progress; }
.main { min-width: 0; }
.dom { font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dom .rk { color: var(--muted); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dom bdi { word-break: break-all; }
.path { display: block; font-size: 12.5px; color: var(--muted); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }
html[dir="rtl"] .path { text-align: right; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 12.5px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.dr { background: var(--brand-soft); color: var(--brand); }
.dr.hi { background: var(--brand); color: #fff; }
.traf { color: var(--muted); font-weight: 500; }
.df { background: var(--done-soft); color: var(--done); }
.nf { background: var(--bg); color: var(--muted); font-weight: 500; }
.o2 { background: var(--hot-soft); color: var(--hot); }
.o1 { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.o3 { background: var(--brand-soft); color: var(--brand); }
.open { text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; background: var(--surface); }
.open:hover { border-color: var(--brand); color: var(--brand); }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }

/* spam view */
.spamnote { background: var(--warn-soft); border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-bottom: 10px; }
.spamgrid { list-style: none; padding: 0; margin: 0 0 24px; columns: 3 220px; column-gap: 16px; font-size: 13.5px; }
.spamgrid li { break-inside: avoid; display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.spamgrid bdi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spamgrid span { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

.gloss { border-top: 1px solid var(--line); padding: 18px 0 32px; color: var(--muted); font-size: 13.5px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.gloss b { color: var(--ink); display: block; }

.toast { position: fixed; inset-inline: 16px; bottom: 16px; margin: 0 auto; max-width: 520px; z-index: 20; background: #142320; color: #fff; border-radius: 14px; padding: 12px 12px 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); transform: translateY(140%); transition: transform .25s ease; }
.toast.show { transform: none; }
.toast .msg { flex: 1; min-width: 0; font-size: 14px; }
.toast .msg bdi { font-weight: 600; }
.toast button { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; background: #9fd8c9; color: #00332c; white-space: nowrap; }
.toast .bar2 { position: absolute; inset-inline: 14px; bottom: 5px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.toast .bar2 i { display: block; height: 100%; background: #9fd8c9; width: 100%; }
@media (max-width: 760px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .prog { grid-column: 1 / -1; }
  .steps { grid-template-columns: 1fr; gap: 6px; }
  .row { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 12px; }
  .meta { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
  .open { padding: 8px 10px; }
  .gloss { grid-template-columns: 1fr; }
  .title h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

        <option value="tr" data-t="sTR"></option>
        <option value="az" data-t="sAZ"></option>
      </select>
    </div>
    <div class="chips" id="chips" role="group"></div>
  </div>

  <section id="view" aria-live="polite"></section>

  <footer class="gloss">
    <div><b data-t="g1h"></b><span data-t="g1"></span></div>
    <div><b data-t="g2h"></b><span data-t="g2"></span></div>
    <div><b data-t="g3h"></b><span data-t="g3"></span></div>
  </footer>
</main>

    empty: "Keine Seiten für diesen Filter.",
    spamNote: "{n} automatisierte Spam-Seiten verlinken die Wettbewerber. Das sind keine Chancen: hier nicht eintragen.",
    noDb: "Gemeinsames Speichern ist noch nicht aktiv (Upstash Redis im Vercel-Projekt hinzufügen). Bis dahin werden Haken nur auf diesem Gerät gespeichert.", pinAsk: "Speicher-PIN eingeben (TRACKER_PIN):", pinSave: "PIN speichern", pinOk: "PIN gespeichert. Bitte ✓ erneut anklicken.",
    errSave: "Änderung nicht gespeichert. Bitte Verbindung prüfen und erneut versuchen.", roMsg: "Nur-Lese-Ansicht. Haken setzt die Inhaberin der Seite.",
    g1h: "DR (Domain Rating)", g1: "0 bis 100 laut Ahrefs. Ein Link von einer starken Seite bringt mehr als viele schwache.",
    g2h: "dofollow / nofollow", g2: "dofollow hilft beim Google-Ranking. nofollow bringt nur Besucher, ist aber trotzdem nützlich für die Sichtbarkeit.",
    g3h: "Starke Chance", g3: "Seite mit DR 30+, die mindestens einen Wettbewerber verlinkt. „Verlinkt karinex schon“ heißt: karinex.de ist dort bereits gelistet. Quelle: Ahrefs, 17.11.2026."
  }
};
const NF = new Intl.NumberFormat("de-DE");
const COMPS = DATA.comps;
const G = DATA.good.map(g => ({ d: g[0], dr: g[1], tr: g[2], df: g[3], o: g[4], l: g[5] }));
const SP = DATA.spam.map(s => ({ d: s[0], dr: s[1], c: s[2] }));
const COLORS = ["#004f44", "#1d4ed8", "#8a3ab9", "#c2410c", "#0e7490", "#be185d"];
const DEFAULT_STORES = ["karinex.de", "softwarekey.de"];
let lang = "ar", filter = "all", sort = "dr", q = "", comp = -1;
try { const c = parseInt(localStorage.getItem("karinex-comp"), 10); if (c >= -1 && c < COMPS.length) comp = c; } catch (e) {}
const inComp = x => comp < 0 || !!x.l[comp];
const urlOf = x => (comp >= 0 && x.l[comp]) || x.l.find(Boolean) || "";
const shortName = n => n.replace(/\.(de|com|nl|at|ch)$/, "");
let stores = DEFAULT_STORES.slice();
let cur = stores[0];
let done = new Map();      // domain -> {store: ISO date}
let mode = "loading";      // loading | db | local | ro
let db = null, col = null;
const pending = new Set();
let addOpen = false, addErr = "";

const $ = s => document.querySelector(s);
const t = (k, v) => { let s = T[lang][k] || ""; if (v) for (const [a, b] of Object.entries(v)) s = s.split("{" + a + "}").join(b); return s; };
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "" : String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shortPath = u => { try { const x = new URL(u); let p = x.hostname.replace(/^www\./, "") + x.pathname; return decodeURIComponent(p).replace(/\/$/, ""); } catch (e) { return u; } };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const color = s => COLORS[Math.max(0, stores.indexOf(s)) % COLORS.length];
const marksOf = d => done.get(d) || {};
const isDone = (d, s = cur) => !!marksOf(d)[s];
const haveFor = x => x.o === 3 && cur === "karinex.de";

function setLang(l) {
  lang = l === "de" ? "de" : "ar";
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = lang === "ar" ? "متتبّع الروابط الخلفية للمنافسين" : "Backlink-Tracker Wettbewerber";
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("#q").placeholder = t("ph");
  $("#l-ar").setAttribute("aria-pressed", lang === "ar");
  $("#l-de").setAttribute("aria-pressed", lang === "de");
  renderAll();
}

function renderStores() {
  const box = $("#stores");
  const keep = addOpen ? (document.getElementById("newStore") || {}).value || "" : "";
  box.innerHTML = `<span class="lbl">${t("storeLbl")}</span>` +
    stores.map(s => `<button type="button" class="sbtn" data-store="${esc(s)}" aria-pressed="${s === cur}" style="--c:${color(s)}"><span class="sd"></span><bdi dir="ltr">${esc(s)}</bdi></button>`).join("") +
    (mode === "ro" ? "" : addOpen
      ? `<form class="addform show" id="addForm"><label for="newStore" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">${t("addStore")}</label><input id="newStore" type="text" inputmode="url" autocomplete="off" placeholder="${esc(t("addPh"))}" value="${esc(keep)}"><button class="ok" type="submit">${t("add")}</button><button class="no" type="button" id="addCancel">${t("cancel")}</button>${addErr ? `<span class="adderr">${esc(addErr)}</span>` : ""}</form>`
      : `<button type="button" class="sbtn add" id="addBtn">${t("addStore")}</button>`);
  if (addOpen) { const i = document.getElementById("newStore"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

function renderComps() {
  const nAll = G.length, per = COMPS.map((c, i) => G.filter(x => x.l[i]).length);
  $("#comps").innerHTML = `<span class="lbl">${t("compLbl")}</span>` +
    `<button type="button" class="cbtn" data-comp="-1" aria-pressed="${comp === -1}">${t("allComps")} <span class="n">${NF.format(nAll)}</span></button>` +
    COMPS.map((c, i) => `<button type="button" class="cbtn" data-comp="${i}" aria-pressed="${comp === i}"><bdi dir="ltr">${esc(c.n)}</bdi> <span class="n">${NF.format(per[i])}</span></button>`).join("");
  $("#compNames").innerHTML = COMPS.map(c => `<bdi dir="ltr">${esc(c.n)}</bdi>`).join(" · ");
  $("#drList").innerHTML = COMPS.map(c => `<div class="drrow"><bdi dir="ltr">${esc(c.n)}</bdi><b>DR ${NF.format(c.dr)}</b></div>`).join("") +
    `<div class="drrow me"><bdi dir="ltr">karinex.de</bdi><b>DR 1,5</b></div>`;
}

function counts() {
  const c = { all: 0, 2: 0, 1: 0, 3: 0, done: 0, open: 0 };
  for (const x of G) { if (!inComp(x)) continue; c[x.o]++; if (!haveFor(x)) { c.all++; if (isDone(x.d)) c.done++; else c.open++; } }
  return c;
}

function renderChips() {
  const c = counts();
  const defs = [["all", "fAll", c.all], ["2", "f2", c[2]], ["1", "f1", c[1]], ["done", "fDone", c.done], ["open", "fOpen", c.open], ["3", "f3", c[3]], ["spam", "fSpam", SP.filter(s => comp < 0 || s.c.includes(comp)).length]];
  $("#chips").innerHTML = defs.map(([k, lbl, n]) =>
    `<button type="button" class="chip${k === "spam" ? " spamchip" : ""}" data-f="${k}" aria-pressed="${filter === k}">${t(lbl)} <span class="n">${NF.format(n)}</span></button>`).join("");
}

function renderSummary() {
  let n = 0, h = 0, target = 0, hotN = 0;
  for (const x of G) {
    if (!inComp(x) || haveFor(x)) continue;
    target++; if (x.dr >= 30) hotN++;
    if (isDone(x.d)) { n++; if (x.dr >= 30) h++; }
  }
  $("#pDone").textContent = NF.format(n);
  $("#pOf").textContent = t("pOf", { n: NF.format(target) });
  $("#pLbl").innerHTML = esc(t("pLbl", { s: "\u0001" })).replace("\u0001", `<bdi dir="ltr" class="cur-store">${esc(cur)}</bdi>`);
  $("#st2").innerHTML = esc(t("st2", { s: "\u0001" })).replace("\u0001", `<bdi dir="ltr" class="cur-store">${esc(cur)}</bdi>`);
  $("#pBar").style.width = (target ? n / target * 100 : 0) + "%";
  $("#pBar").style.background = color(cur);
  $("#sHot").textContent = NF.format(h);
  $("#sHotOf").textContent = " / " + NF.format(hotN);
  $("#sHotL").innerHTML = esc(t("sHot", { s: "\u0001" })).replace("\u0001", `<bdi dir="ltr">${esc(cur)}</bdi>`);
}

function renderSave() {
  const el = $("#save");
  let s = "ok", txt = t("saved");
  if (mode === "loading") { s = "busy"; txt = t("loading"); }
  else if (pending.size) { s = "busy"; txt = t("saving"); }
  else if (mode === "local") { s = "off"; txt = t("local"); }
  else if (mode === "ro") { s = "off"; txt = t("ro"); }
  el.dataset.s = s; $("#saveTxt").textContent = txt;
  const nt = $("#notice");
  if (mode === "local") { nt.textContent = t("noDb"); nt.classList.add("show"); }
  else if (mode === "ro") { nt.textContent = t("roMsg"); nt.classList.add("show"); }
  else if (!nt.dataset.err) nt.classList.remove("show");
}

function rowHTML(x, rank) {
  const url = urlOf(x);
  const cps = COMPS.map((c, i) => x.l[i] ? `<span class="pill cp">${t("links")} ${esc(shortName(c.n))}</span>` : "").join("");
  const on = isDone(x.d), have = haveFor(x);
  const dis = mode === "loading" || mode === "ro" || pending.has(x.d) ? " disabled" : "";
  const check = have ? `<span class="check" style="border-style:dashed;cursor:default" title="${esc(t("o3"))}" aria-hidden="true"></span>`
    : `<button type="button" class="check" role="checkbox" aria-checked="${on}" data-d="${esc(x.d)}" aria-label="${esc(t("mark", { d: x.d, s: cur }))}" style="${on ? `background:${color(cur)};border-color:${color(cur)}` : ""}"${dis}>${CHECK}</button>`;
  const m = marksOf(x.d);
  const badges = stores.filter(s => m[s]).map(s => `<span class="sb" style="--c:${color(s)}">${esc(t("doneOn", { s: s.replace(/\.(de|com|nl|at|ch)$/, ""), date: fmtDate(m[s]) }))}</span>`).join("");
  return `<li class="row${on ? " is-done" : ""}">
    ${check}
    <div class="main">
      <div class="dom"><span class="rk">#${rank}</span><bdi dir="ltr">${esc(x.d)}</bdi></div>
      <a class="path" href="${esc(url)}" target="_blank" rel="noopener">${esc(shortPath(url))}</a>
      ${badges ? `<div class="marks">${badges}</div>` : ""}
    </div>
    <div class="meta">
      <span class="pill dr${x.dr >= 60 ? " hi" : ""}">DR ${NF.format(Math.round(x.dr))}</span>
      <span class="pill traf">${x.tr ? NF.format(x.tr) : "–"} ${t("visits")}</span>
      <span class="pill ${x.df ? "df" : "nf"}">${t(x.df ? "df" : "nf")}</span>
      ${x.o === 3 ? `<span class="pill o3">${t("o3")}</span>` : `<span class="pill o${x.o}">${t("o" + x.o)}</span>`}
      ${cps}
    </div>
    <a class="open" href="${esc(url)}" target="_blank" rel="noopener">${t("open")}</a>
  </li>`;
}

function renderList() {
  const v = $("#view");
  const qq = q.trim().toLowerCase();
  if (filter === "spam") {
    const all = SP.filter(s => comp < 0 || s.c.includes(comp));
    const rows = all.filter(s => !qq || s.d.includes(qq));
    v.innerHTML = `<div class="spamnote">${esc(t("spamNote", { n: NF.format(all.length) }))}</div>` +
      (rows.length ? `<ul class="spamgrid">${rows.map(s => `<li><bdi dir="ltr">${esc(s.d)}</bdi><span>DR ${NF.format(Math.round(s.dr))}</span></li>`).join("")}</ul>` : `<p class="empty">${t("empty")}</p>`);
    return;
  }
  let rows = G.filter(x => {
    if (!inComp(x)) return false;
    if (qq && !x.d.includes(qq)) return false;
    if (filter === "all") return !haveFor(x);
    if (filter === "done") return !haveFor(x) && isDone(x.d);
    if (filter === "open") return !haveFor(x) && !isDone(x.d);
    return String(x.o) === filter;
  });
  rows = rows.slice().sort(sort === "tr" ? (a, b) => b.tr - a.tr : sort === "az" ? (a, b) => a.d.localeCompare(b.d) : (a, b) => b.dr - a.dr || b.tr - a.tr);
  v.innerHTML = rows.length ? `<ul class="list">${rows.map((x, i) => rowHTML(x, i + 1)).join("")}</ul>` : `<p class="empty">${t("empty")}</p>`;
}

function renderAll() { renderComps(); renderStores(); renderSummary(); renderChips(); renderList(); renderSave(); }

/* persistence */
const LS = "karinex-si24-v2", LS_OLD = "karinex-si24-done", LS_CUR = "karinex-si24-cur";
function normalize(body) {           // db/local body -> {store: iso}
  if (!body) return null;
  const out = {};
  if (body.stores && typeof body.stores === "object") for (const [s, v] of Object.entries(body.stores)) if (typeof v === "string") out[s] = v;
  if (typeof body.at === "string" && !out["karinex.de"]) out["karinex.de"] = body.at;   // marks made before stores existed
  return Object.keys(out).length ? out : null;
}
function loadLocal() {
  try {
    const o = JSON.parse(localStorage.getItem(LS) || "null");
    if (o) { done = new Map(Object.entries(o.done || {})); if (Array.isArray(o.stores) && o.stores.length) stores = o.stores; }
    else { const old = JSON.parse(localStorage.getItem(LS_OLD) || "{}"); done = new Map(Object.entries(old).map(([d, at]) => [d, { "karinex.de": at }])); }
  } catch (e) {}
  if (!stores.includes(cur)) cur = stores[0];
}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify({ stores, done: Object.fromEntries(done) })); } catch (e) {} }
try { const c = localStorage.getItem(LS_CUR); if (c) cur = c; } catch (e) {}

function toLocal() { if (mode !== "loading") return; mode = "local"; loadLocal(); renderAll(); }

function showErr(msg) { const nt = $("#notice"); nt.textContent = msg; nt.dataset.err = "1"; nt.classList.add("show"); }

async function setMarks(d, after) {
  const before = Object.assign({}, marksOf(d));
  if (Object.keys(after).length) done.set(d, after); else done.delete(d);
  delete $("#notice").dataset.err;
  if (mode === "local") { saveLocal(); renderAll(); return true; }
  pending.add(d); renderAll();
  let ok = true;
  try {
    await api({ domain: d, marks: after });
  } catch (e) {
    ok = false;
    if (Object.keys(before).length) done.set(d, before); else done.delete(d);
    if (e && e.code === "pin") askPin(); else showErr(t("errSave"));
  }
  pending.delete(d); renderAll();
  return ok;
}

let toastTimer = null, undoFn = null;
function toast(html, fn) {
  const el = $("#toast");
  $("#toastMsg").innerHTML = html;
  $("#undoBtn").textContent = t("undo");
  $("#undoBtn").style.display = fn ? "" : "none";
  undoFn = fn;
  const bar = $("#toastBar");
  bar.style.transition = "none"; bar.style.width = "100%";
  el.classList.add("show");
  const ms = fn ? 8000 : 2200;
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${ms}ms linear`; bar.style.width = "0%"; }));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); undoFn = null; }, ms);
}
const fill = (k, d, s) => esc(t(k, { d: "\u0001", s: "\u0002" })).replace("\u0001", `<bdi dir="ltr">${esc(d)}</bdi>`).replace("\u0002", `<bdi dir="ltr">${esc(s)}</bdi>`);

async function toggle(d) {
  if (mode === "loading" || mode === "ro" || pending.has(d)) return;
  const store = cur;
  const before = Object.assign({}, marksOf(d));
  const after = Object.assign({}, before);
  const adding = !after[store];
  if (adding) after[store] = new Date().toISOString(); else delete after[store];
  const ok = await setMarks(d, after);
  if (!ok) return;
  toast(fill(adding ? "tOn" : "tOff", d, store), async () => {
    const now = Object.assign({}, marksOf(d));
    if (before[store]) now[store] = before[store]; else delete now[store];
    if (await setMarks(d, now)) toast(esc(t("tUndone")), null);
  });
}

async function addStore(raw) {
  const s = String(raw || "").trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "");
  if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(s) || s.length > 60) { addErr = t("badStore"); renderStores(); return; }
  if (stores.includes(s)) { addErr = t("dupStore"); renderStores(); return; }
  const prev = stores.slice();
  stores = stores.concat(s); cur = s; addOpen = false; addErr = "";
  try { localStorage.setItem(LS_CUR, cur); } catch (e) {}
  if (mode === "local") { saveLocal(); renderAll(); return; }
  renderAll();
  try { await api({ stores }); }
  catch (e) { stores = prev; if (!stores.includes(cur)) cur = stores[0]; if (e && e.code === "pin") askPin(); else showErr(t("errSave")); renderAll(); }
}

document.addEventListener("click", e => {
  const c = e.target.closest(".check[data-d]"); if (c) { toggle(c.dataset.d); return; }
  const f = e.target.closest(".chip"); if (f) { filter = f.dataset.f; renderChips(); renderList(); return; }
  const cb = e.target.closest(".cbtn[data-comp]"); if (cb) { comp = parseInt(cb.dataset.comp, 10); try { localStorage.setItem("karinex-comp", comp); } catch (er) {} renderAll(); return; }
  const st = e.target.closest(".sbtn[data-store]"); if (st) { cur = st.dataset.store; try { localStorage.setItem(LS_CUR, cur); } catch (er) {} renderAll(); return; }
  if (e.target.closest("#addBtn")) { addOpen = true; addErr = ""; renderStores(); return; }
  if (e.target.closest("#addCancel")) { addOpen = false; addErr = ""; renderStores(); return; }
  const l = e.target.closest(".lang button"); if (l) { location.hash = l.dataset.lang; }
});
$("#undoBtn").addEventListener("click", () => { const f = undoFn; undoFn = null; clearTimeout(toastTimer); $("#toast").classList.remove("show"); if (f) f(); });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && undoFn && !e.target.closest("input")) { e.preventDefault(); $("#undoBtn").click(); } });
document.addEventListener("submit", e => { if (e.target.id === "addForm") { e.preventDefault(); addStore(document.getElementById("newStore").value); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && addOpen) { addOpen = false; addErr = ""; renderStores(); } });
$("#q").addEventListener("input", e => { q = e.target.value; renderList(); });
$("#sort").addEventListener("change", e => { sort = e.target.value; renderList(); });
window.addEventListener("hashchange", () => setLang(location.hash.slice(1)));

if (!stores.includes(cur)) cur = stores[0];
setLang(location.hash.slice(1));

/* server storage (Vercel function /api/marks) */
const PIN_KEY = "karinex-tracker-pin";
const getPin = () => { try { return localStorage.getItem(PIN_KEY) || ""; } catch (e) { return ""; } };
async function api(body) {
  const r = await fetch("/api/marks", { method: "POST", headers: { "Content-Type": "application/json", "X-Tracker-Pin": getPin() }, body: JSON.stringify(body) });
  if (r.status === 401) throw { code: "pin" };
  if (!r.ok) throw { code: "http" };
  return r.json();
}
function askPin() {
  const nt = $("#notice");
  nt.innerHTML = `<form id="pinForm" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label for="pinIn">${esc(t("pinAsk"))}</label><input id="pinIn" type="password" autocomplete="current-password" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)"><button type="submit" style="border:0;border-radius:8px;padding:7px 14px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer">${esc(t("pinSave"))}</button></form>`;
  nt.dataset.err = "1"; nt.classList.add("show");
  document.getElementById("pinIn").focus();
}
document.addEventListener("submit", e => {
  if (e.target.id !== "pinForm") return;
  e.preventDefault();
  try { localStorage.setItem(PIN_KEY, document.getElementById("pinIn").value); } catch (er) {}
  const nt = $("#notice"); delete nt.dataset.err; nt.textContent = t("pinOk"); setTimeout(() => nt.classList.remove("show"), 2500);
});
function applyServer(j) {
  const list = Array.isArray(j.stores) ? j.stores.filter(x => typeof x === "string") : [];
  stores = DEFAULT_STORES.concat(list.filter(x => !DEFAULT_STORES.includes(x)));
  if (!stores.includes(cur)) cur = stores[0];
  const m = new Map();
  for (const [d, v] of Object.entries(j.done || {})) { const n = normalize({ stores: v }); if (n) m.set(d, n); }
  for (const d of pending) { if (done.has(d)) m.set(d, done.get(d)); else m.delete(d); }
  done = m;
}
async function load(first) {
  try {
    const r = await fetch("/api/marks", { cache: "no-store" });
    if (!r.ok) throw 0;
    const j = await r.json();
    if (j.configured === false) throw 0;
    applyServer(j);
    mode = "db"; renderAll();
  } catch (e) { if (first) toLocal(); }
}
load(true);
setInterval(() => { if (mode === "db" && !pending.size && !document.hidden) load(false); }, 30000);
</script>
