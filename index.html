<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backlink-Tracker Wettbewerber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: brand band with progress, then a filterable checklist of the competitor's link sources. KARINEX green. */
:root {
  --brand: #004f44;
  --brand-soft: #e3efec;
  --bg: #f4f7f6;
  --surface: #ffffff;
  --ink: #142320;
  --muted: #5b6b67;
  --line: #dbe5e2;
  --done: #067647;
  --done-soft: #e5f4ec;
  --hot: #b54708;
  --hot-soft: #fdf0e1;
  --warn: #b42318;
  --warn-soft: #fdecea;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #3fae98; --brand-soft: #16302b; --bg: #0c1513; --surface: #13201d; --ink: #e3eeeb;
    --muted: #94a8a3; --line: #23372f; --done: #4cc38a; --done-soft: #12302a; --hot: #f0a356;
    --hot-soft: #33240f; --warn: #f2877c; --warn-soft: #351815; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #3fae98; --brand-soft: #16302b; --bg: #0c1513; --surface: #13201d; --ink: #e3eeeb;
  --muted: #94a8a3; --line: #23372f; --done: #4cc38a; --done-soft: #12302a; --hot: #f0a356;
  --hot-soft: #33240f; --warn: #f2877c; --warn-soft: #351815; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px; }

/* header band */
.band { background: #004f44; color: #fff; padding: 20px 0 64px; }
#comps { margin-top: 8px; }
.band .wrap.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.title h1 { margin: 0; font-size: 24px; font-weight: 700; text-wrap: balance; }
.title p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
.title p bdi { font-weight: 600; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lang { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; }
.lang button { border: 0; background: transparent; color: #fff; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.lang button[aria-pressed="true"] { background: #fff; color: #004f44; }
.save { font-size: 13px; display: inline-flex; gap: 6px; align-items: center; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; }
.save .dot { width: 8px; height: 8px; border-radius: 50%; background: #9fd8c9; }
.save[data-s="busy"] .dot { background: #ffd28a; }
.save[data-s="off"] .dot { background: #ffb4ab; }

/* store bar */
.stores { margin-top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stores .lbl { font-size: 14px; opacity: .85; }
.sbtn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 7px; align-items: center; }
.sbtn .sd { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #fff; }
.sbtn[aria-pressed="true"] { background: #fff; color: #004f44; border-color: #fff; }
.sbtn.add { border-style: dashed; font-weight: 500; }
.addform { display: none; gap: 6px; align-items: center; flex-wrap: wrap; }
.addform.show { display: inline-flex; }
.addform input { border: 0; border-radius: 999px; padding: 6px 14px; width: 170px; color: #142320; background: #fff; direction: ltr; }
.addform button { border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.addform .ok { background: #9fd8c9; color: #00332c; }
.addform .no { background: rgba(255,255,255,.15); color: #fff; }
.adderr { font-size: 13px; color: #ffd28a; width: 100%; }
.marks { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.sb { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--c); color: #fff; white-space: nowrap; }
.cur-store { color: var(--ink); font-weight: 700; }

/* summary */
.summary { margin-top: -44px; display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.prog .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.prog .big small { font-size: 16px; color: var(--muted); font-weight: 500; }
.prog .lbl { color: var(--muted); font-size: 14px; }
.bar { height: 10px; background: var(--brand-soft); border-radius: 99px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width .4s ease; }
.stat .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .v.hot { color: var(--hot); }
.stat .l { color: var(--muted); font-size: 13.5px; }
.stat .vs { font-size: 13.5px; margin-top: 4px; }
.stat .vs b { font-variant-numeric: tabular-nums; }
.drrow { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.drrow:last-child { border: 0; }
.drrow b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.drrow bdi { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drrow.me { color: var(--brand); font-weight: 600; }
.cbtn { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 500; font-size: 13.5px; }
.cbtn[aria-pressed="true"] { background: rgba(255,255,255,.2); border-color: #fff; font-weight: 700; }
.cbtn .n { opacity: .8; font-variant-numeric: tabular-nums; }
.cp { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); font-weight: 500; }

/* steps */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.steps li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 700; display: grid; place-items: center; font-size: 13px; }

.notice { display: none; margin-top: 12px; background: var(--hot-soft); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.notice.show { display: block; }

/* controls */
.controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.searchrow { display: flex; gap: 10px; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; }
.sort { min-width: 0; max-width: 42%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip[aria-pressed="true"] .n { color: rgba(255,255,255,.85); }
.chip.spamchip[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); }

/* list */
.list { list-style: none; margin: 0 0 24px; padding: 0; display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 14px; align-items: center; transition: background .2s; }
.row.is-done { background: var(--done-soft); border-color: transparent; }
.check { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .15s, border-color .15s; }
.check svg { width: 22px; height: 22px; stroke: transparent; }
.check:hover { border-color: var(--done); }
.check[aria-checked="true"] { background: var(--done); border-color: var(--done); }
.check[aria-checked="true"] svg { stroke: #fff; }
.check:disabled { opacity: .5; cursor: progress; }
.main { min-width: 0; }
.dom { font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dom .rk { color: var(--muted); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dom bdi { word-break: break-all; }
.path { display: block; font-size: 12.5px; color: var(--muted); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }
html[dir="rtl"] .path { text-align: right; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 12.5px; border-radius: 999px; padding: 2px 9px; white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.dr { background: var(--brand-soft); color: var(--brand); }
.dr.hi { background: var(--brand); color: #fff; }
.traf { color: var(--muted); font-weight: 500; }
.df { background: var(--done-soft); color: var(--done); }
.nf { background: var(--bg); color: var(--muted); font-weight: 500; }
.o2 { background: var(--hot-soft); color: var(--hot); }
.o1 { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.o3 { background: var(--brand-soft); color: var(--brand); }
.open { text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; background: var(--surface); }
.open:hover { border-color: var(--brand); color: var(--brand); }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }

/* spam view */
.spamnote { background: var(--warn-soft); border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-bottom: 10px; }
.spamgrid { list-style: none; padding: 0; margin: 0 0 24px; columns: 3 220px; column-gap: 16px; font-size: 13.5px; }
.spamgrid li { break-inside: avoid; display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.spamgrid bdi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spamgrid span { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

.gloss { border-top: 1px solid var(--line); padding: 18px 0 32px; color: var(--muted); font-size: 13.5px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.gloss b { color: var(--ink); display: block; }

.toast { position: fixed; inset-inline: 16px; bottom: 16px; margin: 0 auto; max-width: 520px; z-index: 20; background: #142320; color: #fff; border-radius: 14px; padding: 12px 12px 12px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); transform: translateY(140%); transition: transform .25s ease; }
.toast.show { transform: none; }
.toast .msg { flex: 1; min-width: 0; font-size: 14px; }
.toast .msg bdi { font-weight: 600; }
.toast button { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; cursor: pointer; background: #9fd8c9; color: #00332c; white-space: nowrap; }
.toast .bar2 { position: absolute; inset-inline: 14px; bottom: 5px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.toast .bar2 i { display: block; height: 100%; background: #9fd8c9; width: 100%; }
/* tabs */
.tabs { display: flex; gap: 6px; margin-top: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; padding: 10px 14px; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 7px; align-items: center; }
.tab .n { font-size: 12.5px; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.controls[data-tab="plan"], .controls[data-tab="auto"] { display: none; }
.controls[data-tab="broken"] .chips, .controls[data-tab="broken"] .sort { display: none; }

/* broken links */
.dead { display: block; font-size: 12.5px; color: var(--warn); text-decoration: line-through; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: start; }
html[dir="rtl"] .dead { text-align: right; }
.kind-a { background: var(--done-soft); color: var(--done); }
.kind-f { background: var(--bg); color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.copy { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; background: var(--surface); cursor: pointer; white-space: nowrap; }
.copy:hover { border-color: var(--brand); color: var(--brand); }

/* claude + automation */
.ai-btn { border: 1px solid var(--brand); color: var(--brand); background: var(--brand-soft); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.ai-btn.ready { background: var(--brand); color: #fff; }
.ai-btn.sent { background: var(--done-soft); color: var(--done); border-color: transparent; }
.pill.ver { background: var(--done); color: #fff; }
.pill.new { background: var(--hot); color: #fff; }
dialog.ai { overflow: auto; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 24px); border: 0; border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog.ai::backdrop { background: rgba(10,20,18,.55); }
.ai-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.ai-head h2 { margin: 0; font-size: 18px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.ai-head h2 bdi { word-break: break-all; }
.xbtn { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 10px; font-size: 20px; cursor: pointer; flex: none; }
.ai-body { padding: 14px 18px 18px; display: grid; gap: 12px; }
.ai-box { background: var(--brand-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: grid; gap: 6px; }
.ai-box .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.ai-box p { margin: 0; }
.ai-warn { background: var(--hot-soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.ai-err { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.fld { display: grid; gap: 4px; }
.fld label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.fld input, .fld textarea, .fld select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); direction: ltr; text-align: left; }
.fld textarea { min-height: 260px; resize: vertical; line-height: 1.5; font-size: 14.5px; }
.fld.rtl input, .fld.rtl textarea { direction: auto; text-align: start; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.b1 { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 14.5px; background: var(--brand); color: #fff; cursor: pointer; text-decoration: none; }
.b2 { border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; background: var(--surface); cursor: pointer; text-decoration: none; white-space: nowrap; }
.b2:hover { border-color: var(--brand); color: var(--brand); }
.b2.ok { background: var(--done); border-color: var(--done); color: #fff; }
.olsel { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--surface); font-size: 13.5px; max-width: 100%; }
.seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.spin { width: 22px; height: 22px; border: 3px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: sp 0.9s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
.loadrow { display: flex; gap: 12px; align-items: center; padding: 18px 0; color: var(--muted); }
.auto { display: grid; gap: 14px; margin: 14px 0 24px; }
.feat { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.feat span { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; }
.feat .y { background: var(--done-soft); color: var(--done); }
.feat .n { background: var(--warn-soft); color: var(--warn); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.kpi { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.kpi b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.qh { margin: 4px 0 0; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.qh .n { font-size: 12.5px; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 0 8px; }
.qitem { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.qitem .t { font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.qitem .s { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qitem .s bdi { direction: ltr; }
.qitem .btnrow { justify-content: flex-end; }
.legal { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin: 0; }
.setgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.setgrid .full { grid-column: 1 / -1; }
.setgrid textarea { min-height: 90px; }

/* plan */
.plan { list-style: none; margin: 14px 0 24px; padding: 0; display: grid; gap: 12px; counter-reset: p; }
.pstep { counter-increment: p; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; }
.pstep::before { content: counter(p); grid-row: span 3; width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700; display: grid; place-items: center; }
.pstep h3 { margin: 0; font-size: 17px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.pstep h3 .pc { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.pstep p { margin: 0; color: var(--muted); font-size: 14px; }
.pstep .when { font-size: 12.5px; font-weight: 700; color: var(--hot); background: var(--hot-soft); border-radius: 999px; padding: 1px 9px; }
.plinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pl { text-decoration: none; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; background: var(--bg); }
.pl:hover { border-color: var(--brand); }
.pl b { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.pl.ok { background: var(--done-soft); border-color: transparent; color: var(--done); }
.pl.have { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.pbtn { display: inline-block; margin-top: 8px; text-decoration: none; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; background: var(--brand); color: #fff; cursor: pointer; }
.warnbox { background: var(--warn-soft); border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-top: 14px; }

@media (max-width: 760px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .prog { grid-column: 1 / -1; }
  .steps { grid-template-columns: 1fr; gap: 6px; }
  .row { grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px 12px; }
  .meta { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; }
  .open { padding: 8px 10px; }
  .gloss { grid-template-columns: 1fr; }

}

    body = `${ai.tpl ? `<div class="ai-warn">${esc(t("aiOff"))}</div>` : ""}${ai.error ? `<div class="ai-err" role="alert">${esc(ai.error)}</div>` : ""}${analysis}
      ${d.followup ? `<div class="seg" role="group"><button type="button" data-aiview="first" aria-pressed="${!fu}">${t("vFirst")}</button><button type="button" data-aiview="follow" aria-pressed="${!!fu}">${t("vFollow")}</button></div>` : ""}
      ${mailish ? `<div class="fld"><label for="aiTo"><span>${t("fTo")}</span>${!to ? `<span style="color:var(--hot)">${esc(t("noMail"))}</span>` : ""}</label><input id="aiTo" type="email" list="aiCands" value="${esc(to)}" autocomplete="off"${fu ? " readonly" : ""}><datalist id="aiCands">${(d.candidates || []).map(c => `<option value="${esc(c)}">`).join("")}</datalist>${cands.length ? `<small style="color:var(--muted)">${esc(t("cands"))} <bdi dir="ltr">${esc(cands.join(", "))}</bdi></small>` : ""}</div>` : ""}
      ${subj || mailish ? `<div class="fld"><label for="aiSubj">${t("fSubj")}</label><input id="aiSubj" type="text" value="${esc(subj || "")}"></div>` : ""}
      <div class="fld"><label for="aiMsg">${t("fMsg")}</label><textarea id="aiMsg" spellcheck="true">${esc(msg || "")}</textarea></div>
      <div class="btnrow">
        ${mailish ? `<button type="button" class="b1" data-aiact="outlook">${t("bOutlook")}</button>${olSelect()}` : ""}
        <button type="button" class="${mailish ? "b2" : "b1"}" data-aiact="copy">${t("bCopy")}</button>
        ${mailish ? `<button type="button" class="b2" data-aiact="copyall">${t("bCopyAll")}</button>` : ""}
      </div>
      <div class="btnrow">
        <a class="b2" href="${esc(d.url || info.url)}" target="_blank" rel="noopener">${t("bPage")}</a>
        ${d.contactUrl ? `<a class="b2" href="${esc(d.contactUrl)}" target="_blank" rel="noopener">${t("bContact")}</a>` : ""}
        <button type="button" class="b2${sent ? " ok" : ""}" data-aiact="sent"${sent ? " disabled" : ""}>${t("bSent")}</button>
        ${claudeOn && d.sentAt && !d.followup && !ai.tpl ? `<button type="button" class="b2" data-aiact="followup">${t("bFollow")}</button>` : ""}
        ${claudeOn && !fu ? `<button type="button" class="b2" data-aiact="regen">${t("bRegen")}</button>` : ""}
        ${!ai.tpl && mode === "db" ? `<button type="button" class="b2" data-aiact="${d.skippedAt ? "unskip" : "skip"}">${t(d.skippedAt ? "bUnskip" : "bSkip")}</button>` : ""}
      </div>`;
  }
  dlg.innerHTML = head + `<div class="ai-body">${body}</div>`;
}

async function aiAct(act) {
  if (!ai) return;
  const d = ai.draft, fu = ai.view === "follow" && d && d.followup;
  if (act === "close") { await aiSave(); closeAI(); return; }
  if (act === "regen") { await aiSave(); aiFetch("regen"); return; }
  if (act === "followup") { aiFetch("new", "followup"); return; }
  const f = aiFields();
  // open/copy first, while the click still counts as a user gesture (pop-up blockers), then save in the background
  if (act === "outlook") { openCompose(fu ? d.recipient_email : f.to, f.subject, f.message); aiSave(); return; }
  if (act === "copy") { copyText(f.message); aiSave(); return; }
  if (act === "copyall") { copyText(`${t("fTo")}: ${fu ? d.recipient_email : f.to}\n${t("fSubj")}: ${f.subject}\n\n${f.message}`); aiSave(); return; }
  if (act === "sent") { await aiSave(); markSent(ai.key, !!fu); return; }
  if (act === "skip" || act === "unskip") { const n = await draftAction(ai.key, act); if (n) { ai.draft = n; renderAI(); renderAll(); } return; }
}

/* automation tab */
function profileOf(s) {
  const def = s === "karinex.de"
    ? { company: "KARINEX", description: "Online-Shop für Original-Software von Microsoft (Windows, Office) mit digitaler Lieferung per E-Mail sowie USB-Produkte." }
    : { company: s, description: "Online-Shop für Original-Software-Lizenzen." };
  return Object.assign({ store: s, shopUrl: `https://${s}/`, sender: "", signature: "" }, def, AUTO.profiles[s] || {});
}
function daysSince(iso) { return Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 86400000)); }
function qItem(d, kind) {
  const info = itemInfo(d.key);
  const fu = kind === "follow";
  const subj = fu ? d.followup.subject : d.subject;
  const act = d.action || "email_outreach";
  const mailish = isMailish(act);
  const sub = kind === "wait" ? esc(t("daysAgo", { n: NF.format(daysSince(d.sentAt)) })) + " · " : "";
  return `<div class="qitem"><div style="min-width:0"><div class="t"><bdi dir="ltr">${esc(info.name)}</bdi><span class="pill dr">DR ${NF.format(Math.round(info.dr))}</span><span class="pill o3">${esc(t("ac_" + act))}</span>${d.key.startsWith("bl--") ? `<span class="pill kind-a">${esc(t("tBroken"))}</span>` : ""}</div>
    <div class="s">${sub}${mailish ? (d.recipient_email ? `<bdi dir="ltr">${esc(d.recipient_email)}</bdi>` : esc(t("noTo"))) + " · " : ""}${esc(subj || (d.message || "").slice(0, 80))}</div></div>
    <div class="btnrow">${kind !== "wait" && mailish && (d.recipient_email || !d.contactUrl || fu) ? `<button type="button" class="b1" data-q="ol${fu ? "f" : ""}" data-k="${esc(d.key)}">${t("bOutlook")}</button>` : ""}
    ${kind === "ready" && d.contactUrl && !d.recipient_email ? `<button type="button" class="b1" data-q="cf" data-k="${esc(d.key)}">${t("bCopy")} + ${t("bContact")}</button>` : ""}
    <button type="button" class="b2" data-ai="${esc(d.key)}"${fu ? ' data-view="follow"' : ""}>${t("bView")}</button>
    ${kind !== "wait" ? `<button type="button" class="b2" data-q="sent${fu ? "f" : ""}" data-k="${esc(d.key)}" title="${esc(t("bSent"))}">✓</button>` : ""}
    ${kind === "ready" ? `<button type="button" class="b2" data-q="skip" data-k="${esc(d.key)}">${t("bSkip")}</button>` : ""}</div></div>`;
}
function renderAuto(v) {
  const intro = `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">${esc(t("aH"))}</h2><p style="margin:0;color:var(--muted);font-size:14.5px">${esc(t("aSub"))}</p>`;
  if (mode !== "db" || !AUTO.configured) { v.innerHTML = `<div class="auto">${intro}<div class="ai-warn" style="margin-top:12px">${esc(t("noAuto"))}</div><p class="legal" style="margin-top:12px">${esc(t("legal"))}</p></div></div>`; return; }
  const F = AUTO.features || {};
  const feat = [["claude", "fClaude"], ["ahrefs", "fAhrefs"], ["cron", "fCron"], ["pin", "fPin"]].map(([k, l]) => `<span class="${F[k] ? "y" : "n"}">${F[k] ? "✓" : "✗"} ${esc(t(l))}</span>`).join("");
  const lr = AUTO.lastrun, st = (lr && lr.steps) || {};
  const ver = st.verify && st.verify.stores && st.verify.stores[cur] ? st.verify.stores[cur].autoMarked.length : 0;
  const kp = [[ver, "kVer"], [((st.discover || {}).added || []).length + ((st.broken || {}).added || []).length, "kNew"], [((st.drafts || {}).made || []).length, "kDr"], [((st.followups || {}).made || []).length, "kFu"], [lr ? lr.errors.length : 0, "kErr"]];
  const when = lr ? new Date(lr.at).toLocaleString(lang === "ar" ? "ar-EG" : "de-DE", { dateStyle: "medium", timeStyle: "short" }) : "";
  const mine = Object.entries(AUTO.drafts).filter(([k]) => k.startsWith(cur + "|")).map(([, d]) => d);
  const drOf = d => itemInfo(d.key).dr;
  const ready = mine.filter(isReadyDraft).sort((a, b) => drOf(b) - drOf(a));
  const follow = mine.filter(d => d.followup && !d.followup.sentAt && !isVerified(d.domain));
  const wait = mine.filter(d => d.sentAt && !isVerified(d.domain) && !(d.followup && !d.followup.sentAt)).sort((a, b) => Date.parse(a.sentAt) - Date.parse(b.sentAt));
  const verRecent = Object.entries(AUTO.verified).filter(([, v]) => v[cur] && daysSince(v[cur]) <= 30).sort((a, b) => Date.parse(b[1][cur]) - Date.parse(a[1][cur]));
  const fresh = G.filter(x => x.n).sort((a, b) => String(b.n).localeCompare(String(a.n)) || b.dr - a.dr).slice(0, 20);
  const sec = (h, n, html) => `<h3 class="qh">${esc(t(h))} <span class="n">${NF.format(n)}</span></h3>${n ? html : `<p class="empty" style="padding:8px 0">${esc(t("qEmpty"))}</p>`}`;
  const p = profileOf(cur);
  v.innerHTML = `<div class="auto">${intro}
      <div class="feat">${feat}</div>
      <div class="kpis">${kp.map(([n, l]) => `<div class="kpi"><b>${NF.format(n)}</b><span>${esc(t(l))}</span></div>`).join("")}</div>
      <div class="btnrow" style="margin-top:12px"><button type="button" class="b1" id="runNow"${runState ? " disabled" : ""}>${runState ? `<span class="spin" style="display:inline-block;width:14px;height:14px;border-width:2px;vertical-align:-2px"></span> ${esc(t("running"))}` : esc(t("runNow"))}</button>
        <span style="color:var(--muted);font-size:13.5px">${lr ? esc(t("lastRun", { d: when })) : esc(t("never"))}</span></div>
      ${lr && lr.errors.length ? `<div class="ai-err" style="margin-top:10px"><bdi dir="ltr">${lr.errors.map(esc).join("<br>")}</bdi></div>` : ""}
      <p class="legal" style="margin-top:12px">${esc(t("legal"))}</p></div>
    ${sec("qReady", ready.length, ready.map(d => qItem(d, "ready")).join(""))}
    ${sec("qFollow", follow.length, follow.map(d => qItem(d, "follow")).join(""))}
    ${sec("qWait", wait.length, wait.map(d => qItem(d, "wait")).join(""))}
    ${sec("qVer", verRecent.length, `<div class="plinks">${verRecent.map(([d, v]) => `<span class="pl ok">✓ <bdi dir="ltr">${esc(d)}</bdi> <b>${fmtDate(v[cur])}</b></span>`).join("")}</div>`)}
    ${sec("qNew", fresh.length, `<ul class="list">${fresh.map((x, i) => rowHTML(x, i + 1)).join("")}</ul>`)}
    <form class="card" id="profForm"><h3 class="qh" style="margin:0">${esc(t("setH", { s: cur }))}</h3><p style="margin:4px 0 0;color:var(--muted);font-size:13.5px">${esc(t("setSub"))}</p>
      <div class="setgrid">
        <div class="fld"><label for="pfCompany">${t("sCompany")}</label><input id="pfCompany" value="${esc(p.company)}"></div>
        <div class="fld"><label for="pfUrl">${t("sUrl")}</label><input id="pfUrl" value="${esc(p.shopUrl)}"></div>
        <div class="fld"><label for="pfSender">${t("sSender")}</label><input id="pfSender" value="${esc(p.sender)}"></div>
        <div class="fld">${olSelect().replace('id="olSel"', 'id="olSel2"').replace('for="olSel"', 'for="olSel2"')}</div>
        <div class="fld full"><label for="pfDesc">${t("sDesc")}</label><textarea id="pfDesc">${esc(p.description)}</textarea></div>
        <div class="fld full"><label for="pfSig">${t("sSig")}</label><textarea id="pfSig">${esc(p.signature)}</textarea></div>
      </div>
      <div class="btnrow" style="margin-top:10px"><button type="submit" class="b1">${t("sSave")}</button></div></form>
  </div>`;
}
async function runNow() {
  if (runState) return;
  runState = "busy"; renderList();
  try {
    const j = await postJSON("/api/daily", {});
    toast(esc(t(j._status === 409 ? "runBusy" : "runDone")), null);
  } catch (e) { if (e && e.code === "pin") askPin(); else showErr(t("aiErr", { e: (e && e.code) || "network" })); }
  runState = "";
  await loadAuto(); await load(false); renderAll();
}
async function saveProfile() {
  const val = id => document.getElementById(id).value;
  const profile = { store: cur, company: val("pfCompany"), shopUrl: val("pfUrl"), sender: val("pfSender"), description: val("pfDesc"), signature: val("pfSig") };
  try { const j = await postJSON("/api/auto", { profile }); if (j.profile) AUTO.profiles[cur] = j.profile; toast(esc(t("sSaved")), null); }
  catch (e) { if (e && e.code === "pin") askPin(); else showErr(t("errSave")); }
}
async function loadAuto() {
  try {
    const r = await fetch("/api/auto", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    AUTO.configured = !!j.configured; AUTO.features = j.features || null;
    if (!j.configured) { renderAll(); return; }
    AUTO.drafts = j.drafts || {}; AUTO.verified = j.verified || {}; AUTO.profiles = j.profiles || {}; AUTO.lastrun = j.lastrun || null; AUTO.runs = j.runs || [];
    for (const row of j.extra || []) {
      if (!Array.isArray(row) || GM.has(row[0])) continue;
      const l = COMPS.map((c, i) => (row[5] && row[5][i]) || "");
      const x = { d: row[0], dr: row[1], tr: row[2] || 0, df: row[3], o: row[4], l, n: row[6] || "1" };
      G.push(x); GM.set(x.d, x);
    }
    for (const row of j.extraBroken || []) {
      if (!Array.isArray(row) || BR.some(b => b.d === row[0])) continue;
      BR.push({ d: row[0], dr: row[1], tr: row[2] || 0, df: row[3], from: row[4], to: row[5], c: row[6], k: row[7], n: row[8] || "1", key: "bl--" + row[0] });
    }
    renderAll();
  } catch (e) {}
}

document.addEventListener("click", async e => {
  const a = e.target.closest("[data-ai]"); if (a) { openAI(a.dataset.ai, a.dataset.view); return; }
  const x = e.target.closest("[data-aiact]"); if (x) { aiAct(x.dataset.aiact); return; }
  const vw = e.target.closest("[data-aiview]"); if (vw && ai) { await aiSave(); ai.view = vw.dataset.aiview; renderAI(); return; }
  if (e.target.id === "ai") { aiAct("close"); return; }
  if (e.target.closest("#runNow")) { runNow(); return; }
  const qb = e.target.closest("[data-q]"); if (qb) {
    const key = qb.dataset.k, d = draftOf(key); if (!d) return;
    if (qb.dataset.q === "ol") openCompose(d.recipient_email || "", d.subject, d.message);
    if (qb.dataset.q === "cf") { copyText(d.message); window.open(d.contactUrl, "_blank", "noopener"); }
    if (qb.dataset.q === "olf") openCompose(d.recipient_email || "", d.followup.subject, d.followup.message);
    if (qb.dataset.q === "sent") markSent(key, false);
    if (qb.dataset.q === "sentf") markSent(key, true);
    if (qb.dataset.q === "skip") { await draftAction(key, "skip"); renderAll(); }
  }
});
document.addEventListener("input", e => { if (ai && e.target.closest("#ai") && /aiTo|aiSubj|aiMsg/.test(e.target.id)) ai.dirty = true; });
document.addEventListener("change", e => {
  if (e.target.id === "olSel" || e.target.id === "olSel2") { olMode = e.target.value; try { localStorage.setItem("karinex-outlook", olMode); } catch (er) {} }
});
document.addEventListener("submit", e => { if (e.target.id === "profForm") { e.preventDefault(); saveProfile(); } });
$("#ai").addEventListener("close", () => { aiSave(); ai = null; $("#ai").innerHTML = ""; });

load(true);
setInterval(() => { if (mode === "db" && !pending.size && !document.hidden) load(false); }, 30000);
})();
</script>
</body>
</html>
